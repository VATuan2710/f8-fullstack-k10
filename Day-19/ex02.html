<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let kwhNum = prompt("Nhập số điện hàng tháng");
      function eleBill(kWh) {
        let totalPrice = 0;
        if (kWh > 0) {
          if (kWh <= 50) {
            totalPrice = kWh * 1678;
          } else if (kWh >= 51 && kWh <= 100) {
            kWh -= 50;
            totalPrice = 50 * 1678 + kWh * 1734;
          } else if (kWh >= 100 && kWh <= 200) {
            kWh -= 100;
            totalPrice = 50 * 1678 + 50 * 1734 + kWh * 2014;
          } else if (kWh >= 201 && kWh <= 300) {
            kWh -= 200;
            totalPrice = 50 * 1678 + 50 * 1734 + 100 * 2014 + kWh * 2536;
          } else if (kWh >= 301 && kWh <= 400) {
            kWh -= 300;
            totalPrice =
              50 * 1678 + 50 * 1734 + 100 * 2014 + 100 * 2536 + kWh * 2834;
          } else {
            kWh -= 400;
            totalPrice =
              50 * 1678 +
              50 * 1734 +
              100 * 2014 +
              100 * 2536 +
              100 * 2834 +
              kWh * 2972;
          }
          alert(`Số tiền điện phải trả cho ${kwhNum}kWh là ${totalPrice} vnd`);
        } else {
          alert(`Nhap lai số kwh là số nguyên dương`);
        }
      }
      eleBill(kwhNum);
    </script>
  </body>
</html>
