<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = prompt("Nhập vào số nguyên n");
      function solve(n) {
        let S = 0,
          P = 1;
        for (let i = 1; i <= n; i++) {
          P = i * (i + 1);
          S += P;
        }
        alert(`Giá trị biểu thức là: ${S}`);
      }
      solve(n);
    </script>
  </body>
</html>
