<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
        width: 100%;
      }

      table,
      th,
      td {
        border: 1px solid black;
        text-align: center;
        padding: 10px;
      }

      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h2>Bảng Cửu Chương</h2>
    <table id="bangCuuChuong"></table>

    <script>
      function taoBangCuuChuong() {
        let table = document.getElementById("bangCuuChuong");

        let headerRow = "<tr>";
        for (let i = 1; i <= 10; i++) {
          headerRow += "<th>Bảng " + i + "</th>";
        }
        headerRow += "</tr>";
        table.innerHTML += headerRow;

        for (let j = 1; j <= 10; j++) {
          let row = "<tr>";
          for (let i = 1; i <= 10; i++) {
            row += "<td>" + i + " x " + j + " = " + i * j + "</td>";
          }
          row += "</tr>";
          table.innerHTML += row;
        }
      }

      taoBangCuuChuong();
    </script>
  </body>
</html>
