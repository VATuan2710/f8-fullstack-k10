<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // const kmNum = 130;
      let kmNum = prompt("Nhập số km");
      kmNum = parseFloat(kmNum);
      let total,
        discount = 0.1;
      function taxiFare(kmNum) {
        if (typeof kmNum === "number" && !Number.isNaN(kmNum) && kmNum > 0) {
          if (kmNum <= 1) {
            total = kmNum * 15000;
          } else if (kmNum <= 5) {
            total = 15000 + (kmNum - 1) * 13500;
          } else {
            total = 15000 + 4 * 13500 + (kmNum - 5) * 11000;
          }
          if (kmNum > 120) {
            total = total - total * discount;
          }
          alert(`Số tiền ứng là ${total} vnd`);
        } else {
          alert("Nhập lại số km dạng số và lớn hơn 0");
        }
      }

      taxiFare(kmNum);
    </script>
  </body>
</html>
