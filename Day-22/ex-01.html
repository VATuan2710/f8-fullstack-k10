<!DOCTYPE html>

  <body>
    <h1>Bai 1</h1>
    <script>
      function reverseArray(arr) {
        let reversedArr = [];
        while (arr.length > 0) {
          reversedArr.push(arr.pop());
        }
        return reversedArr;
      }

      const numbers = [1, 2, 3, 4, 5];
      const reversedNumbers = reverseArray(numbers);
      console.log(reversedNumbers);
    </script>
  </body>
