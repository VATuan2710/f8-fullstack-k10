<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../project-js/assets/css/main.css" />
    <link rel="stylesheet" href="../project-js/assets/css/category.css" />
    <link rel="stylesheet" href="../project-js/assets/css/responsive.css" />
    <script type="module" src="../project-js/assets/js/search.js"></script>
  </head>
  <body>
    <header>
      <input type="checkbox" id="bar-check" hidden />
      <label for="bar-check" class="overlay"></label>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <a href="./index.html">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg"
                alt="Logo"
                style="width: 150px; height: auto"
              />
            </a>
          </div>
          <div class="content">
            <ul>
              <li>
                <a href="../project-js/category.html?category=smartphones">
                  Smart Phones
                </a>
              </li>
              <li>
                <a href="../project-js/category.html?category=fragrances">
                  fragrances
                </a>
              </li>
              <li>
                <a href="../project-js/category.html?category=furniture">
                  Furniture
                </a>
              </li>
              <li>
                <a href="../project-js/category.html?category=groceries">
                  Groceries
                </a>
              </li>
            </ul>
          </div>

          <div class="search-list-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search" id="search" />
            <a href="#" class="bag"><i class="fa-solid fa-bag-shopping"></i></a>
            <div id="search-results" class="search-results-container"></div>
          </div>
          <label class="bar" for="bar-check">
            <i class="fa-solid fa-bars"></i>
          </label>
        </div>
      </nav>
    </header>

    <div class="container" id="category-head">
      <h1 id="title"></h1>
      <div class="filter-sort-section">
        <div class="sort">
          <label for="sort-select">Sắp xếp theo:</label>
          <select id="sort-select">
            <option value="name-az">Tên từ A - Z</option>
            <option value="name-za">Tên từ Z - A</option>
            <option value="price-up">Giá từ thấp đến cao</option>
            <option value="price-down">Giá từ cao đến thấp</option>
          </select>
        </div>
        <div class="filter">
          <label for="min-price">Giá từ:</label>
          <input type="number" id="min-price" placeholder="Giá tối thiểu" />
          <label for="max-price">đến:</label>
          <input type="number" id="max-price" placeholder="Giá tối đa" />
          <button id="filter-price-btn" class="btn btn-primary">Lọc</button>
        </div>
      </div>
    </div>
    <section class="container" id="category"></section>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="../project-js/assets/js/category.js"></script>
    <script type="module" src="../project-js/assets/js/search.js"></script>
  </body>
</html>
