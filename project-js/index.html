<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <title>Shopee - Mua mọi thứ mỗi ngày</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="container">
          <div class="logo">
            <a href="./index.html">
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Shopee.svg"
                alt="Logo"
                style="width: 182px; height: auto"
              />
            </a>
          </div>
          <div class="content">
            <ul>
              <li>
                <a href="./category.html?category=smartphones">Smart Phones</a>
              </li>
              <li><a href="./category.html?category=laptops">Laptops</a></li>
              <li>
                <a href="./category.html?category=furniture">Furniture</a>
              </li>
              <li>
                <a href="./category.html?category=groceries">Groceries</a>
              </li>
            </ul>
          </div>
          <div class="search-list-btn">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search" id="search" />
            <a href="#" class="bag"><i class="fa-solid fa-bag-shopping"></i></a>
            <div id="search-results" class="search-results-container"></div>
          </div>
        </div>
      </nav>
    </header>

    <div class="container">
      <!-- Slide -->
      <section id="Slide">
        <div class="carousel">
          <div class="carousel-inner" id="carousel-inner"></div>
          <div class="control">
            <button class="left-arrow">
              <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button class="right-arrow">
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
          <div class="dot-container" id="dot-container"></div>
        </div>
      </section>
      <!-- End Slide -->
      <section>
        <!-- banner -->
      </section>

      <section>
        <!-- services -->
      </section>

      <section id="category-home">
        <div class="container">
          <div class="category-sections">
            <section class="category-section">
              <h2>Hàng Bán Chạy</h2>
              <div id="hot-sale" class="category-section-content"></div>
            </section>
            <section class="category-section">
              <h2>Hàng Giảm Giá</h2>
              <div id="on-sale" class="category-section-content"></div>
            </section>
            <section class="category-section">
              <h2>Hàng Mới Về</h2>
              <div id="new-arrivals" class="category-section-content"></div>
            </section>
          </div>
        </div>
      </section>
      <section id="danh-cho-name">
        <!-- dành cho nam -->
      </section>

      <section id="danh-cho-nu">
        <!-- dành cho nữ -->
      </section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <script type="module" src="./assets/js/main.js"></script>
    <script type="module" src="./assets/js/slide.js"></script>
    <script type="module" src="./assets/js/search.js"></script>
  </body>
</html>
