<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <input type="checkbox" id="menu-toggle" hidden />

    <label for="menu-toggle"> <div class="overlay"></div></label>

    <div class="container">
      <div class="row">
        <!-- side-bar -->
        <div class="col-3 col-lg-3 side-bar">
          <div class="logo">
            <img src="Images/logo-pro-vip.svg" alt="logo" />
          </div>
          <h2 class="heading">Explore</h2>
          <nav class="navbar">
            <ul>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/linghtning.png"
                    alt="lightning"
                    width="23.51px"
                    height="23.51px"
                  />
                  New in
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/ao.png"
                    alt="Clothing"
                    width="22.33px"
                    height="22.33px"
                  />
                  Clothing
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/shoes.png"
                    alt="Shoes"
                    width="18.81px"
                    height="18.81px"
                  />
                  Shoes
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/bag.png"
                    alt="Accessories"
                    width="18.81px"
                    height="18.81px"
                  />
                  Accessories
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/holy.png"
                    alt=" Activewear"
                    width="21.16px"
                    height="21.16px"
                  />
                  Activewear
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/gift.png"
                    alt="Gifts and Living"
                    width="21.16px"
                    height="21.16px"
                  />
                  Gifts and Living
                </a>
              </li>
              <li>
                <a href="#" class="nav-item">
                  <img
                    src="Images/diamond.png"
                    alt="Inspiration"
                    width="28.21px"
                    height="28.21px"
                  />
                  Inspiration
                </a>
              </li>
            </ul>
            <button class="chat-btn">
              <span class="icon">
                <i class="fa-solid fa-comments"></i>
              </span>
              Help center
            </button>
          </nav>
        </div>
        <!-- end side-bar -->

        <div
          class="col-12 col-sm-12 col-md-12 col-lg-9 col-xl-9 col-xxl-9 content"
        >
          <!-- header -->
          <div class="row">
            <div class="header col-12 col-sm-12 col-md-12">
              <label class="menu-toggle" for="menu-toggle">
                <i class="fa-solid fa-bars"> </i>
              </label>
              <form action="" class="search-form">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search" placeholder="Search store" />
              </form>
              <nav class="navbar">
                <a href="" class="nav-link active">Products</a>
                <a href="" class="nav-link">Story</a>
                <a href="" class="nav-link">Manufacturing</a>
                <a href="" class="nav-link">Packaging</a>
              </nav>
              <div class="actions">
                <a href="" class="action-link">
                  <i class="fa-solid fa-bag-shopping"></i>
                </a>
                <a href="" class="action-link">
                  <i class="fa-solid fa-user-tie"></i>
                </a>
              </div>
            </div>
          </div>
          <!-- end header -->

          <!-- main -->
          <div class="row">
            <div class="main-wrapper col-12 col-sm-12 col-md-12">
              <div class="main">
                <div class="wide">
                  <img src="./Images/flower-1.jpg" alt="" />
                </div>
                <div class="tall">
                  <img src="./Images/flower-2.jpg" alt="" />
                </div>
                <div class="wide">
                  <img src="./Images/flower-3.jpg" alt="" />
                </div>

                <div class="tall">
                  <img src="./Images/flower-4.jpg" alt="" />
                </div>
                <div class="tall">
                  <img src="./Images/flower-5.jpg" alt="" />
                </div>
                <div class="tall">
                  <img src="./Images/flower-6.jpg" alt="" />
                </div>
                <div class="wide">
                  <img src="./Images/flower-7.jpg" alt="" />
                </div>
                <div class="wide">
                  <img src="./Images/flower-8.jpg" alt="" />
                </div>
              </div>
            </div>
          </div>
          <!-- end main -->
        </div>
      </div>
    </div>
  </body>
</html>
